<!DOCTYPE html>
<html>

<head>
  <title>TETRIS GAMES WITH JAVASCRIPT</title>
  <link rel="stylesheet" type="text/css" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <h1>Teris</h1>

  <div id="tetris" style="margin-left: 500px;">
    <div id="info">
      <div id="next_shape"></div>
      <p id="level">Level: <span></span></p>
      <p id="lines">Lines: <span></span></p>
      <p id="score">Score: <span></span></p>
      <p id="time">Time: <span></span></p>
      <button id="start">Start</button>
      <div class="container">
        <a href="index (2).html"><button id="reset"><i class="fa-solid fa-rotate-right"></i></button></a>
        <a href="home.html"><button id="home"><i class="fa-solid fa-house"></i></button></a>
      </div>
      <p class="red">Press the Esc button to pause<span></span></p>
    </div>
    <div id="canvas"></div>
  </div>
  <script type="text/javascript" src="script (2).js"></script>
</body>

</html>
